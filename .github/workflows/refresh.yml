name: Refresh ESPN + Torvik Data

on:
  schedule:
    - cron: '0 6 * * *'   # 2am ET — catches overnight game results
    - cron: '0 18 * * *'  # 2pm ET — catches same-day odds/lines after morning results
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch ESPN game data
        run: python scripts/fetch_data.py

      - name: Fetch Torvik stats
        run: python scripts/fetch_torvik.py

      - name: Fetch ESPN odds, BPI predictions, and futures
        run: python scripts/fetch_odds.py

      - name: Fetch injury news flags
        run: python scripts/fetch_injuries.py
        continue-on-error: true

      - name: Fetch roster stats for all bracket teams
        run: python scripts/fetch_rosters.py
        continue-on-error: true

      - name: Recompute transitive analysis
        run: python scripts/compute_transitive.py

      - name: Install Python dependencies
        run: pip install requests 2>/dev/null || true

      - name: Copy all data to public/data
        run: |
          mkdir -p public/data
          # Copy atomically — all files or none, prevents partial state
          cp data/graph_data.json          public/data/graph_data.json
          cp data/roster_stats.json        public/data/roster_stats.json
          cp data/not_played.json          public/data/not_played.json
          cp data/recent_form.json         public/data/recent_form.json
          cp data/torvik_stats.json        public/data/torvik_stats.json
          cp data/transitive_analysis.json public/data/transitive_analysis.json
          cp data/espn_odds.json           public/data/espn_odds.json
          echo "All data files copied successfully at $(date -u)"
          echo "Sizes:"
          ls -lh public/data/*.json | awk '{print $5, $9}'

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ public/data/
          git diff --staged --quiet && echo "No changes to commit." && exit 0
          git commit -m "chore: refresh ESPN + Torvik + injury data $(date -u +'%Y-%m-%d')"
          git push origin HEAD:main
