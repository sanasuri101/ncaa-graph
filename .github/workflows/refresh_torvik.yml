name: Refresh Torvik Stats

on:
  schedule:
    # 6:15 AM UTC daily — runs 15 min after the ESPN refresh so data stays in sync
    - cron: '15 6 * * *'
  workflow_dispatch:   # manual trigger from Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Torvik T-Rank stats
        run: python scripts/fetch_torvik.py

      - name: Commit updated stats
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/torvik_stats.json public/data/torvik_stats.json
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "chore: refresh Torvik stats $(date -u +'%Y-%m-%d')"
          git push
